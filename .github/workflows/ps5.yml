# Build the PlayStation 5 title on every push, so that a build to test is one
# download away: the run's PPSA99620 artifact is the title folder, ready to
# copy to the console, which downloads the game data on its first boot. See
# docs/PS5.md.

name: PS5 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 libclang-rt-18-dev cmake ninja-build \
            python3 python3-venv curl unzip git

      # About 600 MB of SDKs and 750 MB of game data (the first boot screen
      # takes the game's font from it), each checked against its pinned
      # SHA-256 by tools/ps5/deps.sh or tools/ps5/game-data.sh whether it
      # came from here or from the network.
      - name: Cache the downloads
        uses: actions/cache@v4
        with:
          path: build/ps5-deps/downloads
          key: ps5-deps-${{ hashFiles('tools/ps5/deps.sh', 'tools/ps5/game-data.sh') }}

      - name: Build and package
        run: tools/ps5/build.sh

      # The folder rather than package.sh's zip, so that unzipping the
      # artifact gives PPSA99620/ to upload, not another zip.
      - name: Upload the title folder
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99620
          path: |
            build/ps5/dist/
            !build/ps5/dist/*.zip
          if-no-files-found: error

      # For a release, package.sh's zip itself: it keeps the 0777 permissions
      # the console wants, which an artifact's own zip does not.
      - name: Upload the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: build/ps5/dist/PPSA99620.zip
          if-no-files-found: error

  # A tag starting with v (v2.5-ps5.1, say) publishes that build as a GitHub
  # release, with the title zipped for players to download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Dr. Robotnik's Ring Racers for jailbroken PS5 consoles, as a native title.

          1. Unzip `PPSA99620.zip` and copy the `PPSA99620` folder to `/data/homebrew/` with an FTP client.
          2. Launch it the way your loader launches native titles (ShadowMountPlus, for example).
          3. The first launch downloads the game data (750 MB) from Kart Krew's Ring Racers 2.4 release, so the console needs to be online. Every launch after that goes straight to the game.

          Renders at up to 3840x2160 and outputs 4K by default. This build is Ring Racers 2.5 (upstream `master`), so it cannot join public 2.4 servers. Not affiliated with Kart Krew: please report problems here, not to them. See docs/PS5.md for options and troubleshooting.
          EOF
          gh release create "$GITHUB_REF_NAME" PPSA99620.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ring Racers for PS5 $GITHUB_REF_NAME" \
            --notes-file notes.md
